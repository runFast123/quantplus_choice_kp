name: Signal checks refit

# Refits the RSI dip check at each quarter start (ADR-038): pipelines/eod/checks_refit.py reads the training set from
# Supabase, fits on finished trades only and stores the quarter's model; the database scores new RSI dip setups with
# it from the next run of the EOD pipeline. Runs before the first session of the quarter; idempotent.
# Repository secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: "30 1 1 1,4,7,10 *"   # 07:00 IST on 1 January, April, July and October
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter start (YYYY-MM-DD); empty = the current quarter"
        default: ""

permissions:
  contents: read

concurrency:
  group: signal-checks-refit
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: pipelines/eod } }
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QUARTER: ${{ github.event.inputs.quarter }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: guard
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set in GitHub Secrets; the quarterly refit was skipped."; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == '1'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipelines/eod/requirements-refit.txt }
      - name: Install
        if: steps.guard.outputs.ok == '1'
        run: pip install -r requirements-refit.txt
      - name: Unit tests
        if: steps.guard.outputs.ok == '1'
        run: python -m unittest test_checks_refit
      - name: Refit
        if: steps.guard.outputs.ok == '1'
        run: python checks_refit.py ${QUARTER:+--quarter "$QUARTER"}
