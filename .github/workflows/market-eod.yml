name: Market EOD

# Refreshes the NSE universe (~3,600 symbols) and loads the day's candles from Yahoo Finance (pipelines/eod), then rebuilds
# RSI / signals / backtests, research notes, and runs the notifier.
# Repository secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, Mon–Fri (session settles 15:45 IST)
    - cron: "30 14 * * 1-5"   # 20:00 IST retry; idempotent, picks up late Yahoo updates
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days to (re)fetch (760 ≈ 2-year backfill)"
        default: "10"

permissions:
  contents: read

concurrency:
  group: market-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: pipelines/eod } }
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_URL: ${{ secrets.VERCEL_PROJECT_URL || 'https://quantplus-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configured execution credentials
        id: guard
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode=python" >> "$GITHUB_OUTPUT"
          elif [ -n "$CRON_SECRET" ]; then
            echo "mode=webhook" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither SUPABASE_SERVICE_ROLE_KEY nor CRON_SECRET is set in GitHub Secrets. Automated pipeline skipped. Go to Repo Settings -> Secrets and variables -> Actions to configure them."
          fi

      # Path A: Full Python Pipeline when Supabase direct credentials are present
      - name: Setup Python
        if: steps.guard.outputs.mode == 'python'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipelines/eod/requirements.txt }
      - name: Install Python dependencies
        if: steps.guard.outputs.mode == 'python'
        run: pip install -r requirements.txt
      - name: Run EOD Universe & Price Ingestion
        if: steps.guard.outputs.mode == 'python'
        run: python eod.py --sync-universe --days "${{ github.event.inputs.days || '10' }}"
      - name: Accuracy audit
        if: steps.guard.outputs.mode == 'python'
        run: python audit.py

      # Path B: Production Webhook when CRON_SECRET is configured
      - name: Trigger Production EOD Ingestion Endpoint
        if: steps.guard.outputs.mode == 'webhook'
        run: |
          echo "Triggering $VERCEL_URL/api/cron/market-eod..."
          curl -f -s -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/cron/market-eod?scope=active&days=${{ github.event.inputs.days || '10' }}"

